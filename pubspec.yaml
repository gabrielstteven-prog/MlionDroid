name: mlion_droid
description: MlionDroid Center — painel inteligente para tablet.

version: 1.0.28+29

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Rede e dados
  http: ^1.1.0
  xml: ^6.3.0            # RSS de notícias
  html: ^0.15.4          # programação de TV (futebolnatv)
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  crypto: ^3.0.3         # PKCE do Spotify + SHA-256 das atualizações
  intl: ^0.20.2

  # Interface
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  table_calendar: ^3.1.2
  webview_flutter: ^4.4.2

  # Google Agenda / Tasks
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0

  # Fotos, links e sistema
  file_picker: ^8.0.0
  url_launcher: ^6.2.5

  # Atualização via GitHub Releases
  package_info_plus: ^8.0.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weather/
    - assets/icons/
    - assets/escudos/
    - assets/logos/
    - assets/competicoes/
    - assets/sobre/
